# Deploys after CI passes on main. ags has one environment, live (a paper forward test: there
# is no real money to stage for, and a second env would be a second official record).
# Put a required reviewer on the `live` GitHub Environment so live waits for your click.
# Repo variables: AWS_ACCOUNT_ID (required), AWS_REGION (optional, default eu-west-1).
# See platform docs/deployment.md.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [live]

permissions:
  id-token: write
  contents: read

jobs:
  live:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || inputs.environment == 'live' }}
    uses: i-osipchyk/platform/.github/workflows/lambda-deploy.yml@v0.1.1
    with:
      project: ags
      environment: live
      aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
      aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}
      # No cycle may straddle two image versions: wait for running executions before applying.
      pre-apply: scripts/wait_for_cycle.sh ags-live-cycle
