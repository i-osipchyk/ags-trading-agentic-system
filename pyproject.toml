[project]
name = "ags"
version = "0.1.0"
description = "Ags Trading Analyst — multi-agent research pipeline for agricultural futures"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "ctrader-open-api>=0.9.2",
    "crochet>=2.1",
    "llmkit[openai]",
    "tavily-python>=0.8.4",
    "python-dateutil>=2.9.0.post0",
    "requests>=2.32.3",
    "pyshp>=3.1.6",
    "pypdf>=6.19.0",
    "boto3>=1.43.111",
]

[dependency-groups]
ui = [
    "streamlit>=1.60.0",
]
dev = [
    "moto[s3]>=5.2.4",
    "pytest>=8.0",
]

[tool.uv]
default-groups = ["dev", "ui"]

[tool.uv.sources]
# Pinned to a platform release. To hack on llmkit locally use
# { path = "../platform/llmkit", editable = true } but don't commit it (Docker can't see it).
llmkit = { git = "https://github.com/i-osipchyk/platform", subdirectory = "llmkit", tag = "v0.1.2" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ags"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits a real external service with real credentials; excluded by default, run explicitly with -m integration",
]
addopts = "-m 'not integration'"
